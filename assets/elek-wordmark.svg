<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">elek</title>
  <desc id="desc">elek wordmark with a minimal warm-toned review mark.</desc>
  <style>
    .back { fill: #f7f2ea; }
    .line {
      fill: none;
      stroke: #171412;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accent {
      fill: none;
      stroke: #c76d50;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node { fill: #c76d50; }

    .word {
      fill: #171412;
      font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 118px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .tag {
      fill: #6f6760;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 29px;
      font-weight: 600;
      letter-spacing: 0;
    }
  </style>
  <rect class="back" width="820" height="220" rx="30"/>
  <g transform="translate(30 32)">
    <path class="line" d="M22 40h112M22 86h78M22 132h112"/>
    <path class="accent" d="M136 40 82 132"/>
    <circle class="node" cx="136" cy="132" r="11"/>
  </g>
  <text class="word" x="212" y="121">elek</text>
  <text class="tag" x="218" y="170">review-only ai for pull requests</text>
</svg>
