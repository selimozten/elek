<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">elek reviewing</title>
  <desc id="desc">Animated elek review mark used while a model is reviewing.</desc>
  <style>
    .back { fill: #f7f2ea; }

    .ring {
      fill: none;
      stroke: #c76d50;
      stroke-width: 12;
      stroke-linecap: round;
      stroke-dasharray: 36 138;
    }

    .line {
      fill: none;
      stroke: #171412;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .accent {
      fill: none;
      stroke: #c76d50;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .node { fill: #c76d50; }
  </style>
  <rect class="back" x="8" y="8" width="112" height="112" rx="28"/>
  <circle class="ring" cx="64" cy="64" r="53">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 64 64" to="360 64 64" dur="1.25s" repeatCount="indefinite"/>
  </circle>
  <path class="line" d="M34 42h56M34 64h38M34 86h56"/>
  <path class="accent" d="M91 42 64 86"/>
  <circle class="node" cx="91" cy="86" r="6"/>
</svg>
