name: "elek — AI Code Review"
description: >
  Review-only AI for pull requests. Cross-check changes with independent
  models while keeping every reviewer inside a narrow, non-destructive tool
  surface. Anthropic, OpenAI, Google, Bedrock, DeepSeek, Groq, Mistral,
  Together, xAI, OpenRouter — bring your own key.
branding:
  icon: "filter"
  color: "gray-dark"

inputs:
  # ── Trigger ──
  trigger_phrase:
    description: "Phrase in comments or issue body that triggers the action"
    required: false
    default: "@pi"

  # ── Model ──
  provider:
    description: "AI provider (anthropic, openai, google, bedrock, deepseek, groq, mistral, together, xai, openrouter, etc.)"
    required: false
    default: "anthropic"
  model:
    description: "Model identifier (e.g. claude-sonnet-4-6, claude-opus-4-8, gpt-5.5, moonshotai/kimi-k2.7-code). Leave empty for provider default."
    required: false
    default: ""
  thinking:
    description: "Portable pi thinking level: off, minimal, low, medium, high, xhigh, max. Provider adapters map to native efforts."
    required: false
    default: "medium"

  # ── API Keys (pass through to pi via standard env vars) ──
  anthropic_api_key:
    description: "Anthropic API key"
    required: false
  openai_api_key:
    description: "OpenAI API key"
    required: false
  google_api_key:
    description: "Google Gemini API key"
    required: false
  deepseek_api_key:
    description: "DeepSeek API key"
    required: false
  groq_api_key:
    description: "Groq API key"
    required: false
  mistral_api_key:
    description: "Mistral API key"
    required: false
  together_api_key:
    description: "Together AI API key"
    required: false
  xai_api_key:
    description: "xAI API key"
    required: false
  openrouter_api_key:
    description: "OpenRouter API key"
    required: false

  # ── GitHub Auth ──
  github_token:
    description: "GitHub token with repo and PR permissions. Defaults to GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}

  # ── Behavior ──
  prompt:
    description: "Custom instructions for pi. If empty and triggered via @pi mention, uses the comment/issue body."
    required: false
    default: ""
  system_prompt:
    description: "System prompt override for pi"
    required: false
    default: ""
  max_turns:
    description: "Maximum conversation turns (limits cost). Default: 20."
    required: false
    default: "20"
  run_timeout_seconds:
    description: "Wall-clock timeout for each model run. elek reports a failure review before the outer GitHub step timeout can leave a stale tracking comment."
    required: false
    default: "600"
  tools:
    description: "Legacy low-level pi tool allowlist. Review modes use mode presets; prefer mode unless debugging agent mode."
    required: false
    default: ""
  config_path:
    description: "Repo-local elek config file path. Set to 'none', 'off', or 'false' to disable. Default: .elek.yml"
    required: false
    default: ".elek.yml"
  base_branch:
    description: "Base branch for PRs (defaults to repository default branch)"
    required: false
  branch_prefix:
    description: "Prefix for branches created by elek"
    required: false
    default: "elek/"
  actor_filter:
    description: "Comma-separated usernames allowed to trigger. Empty = repository owners, members, and collaborators."
    required: false
    default: ""
  allowed_bots:
    description: "Comma-separated bot usernames allowed to trigger, or '*' for all"
    required: false
    default: ""
  sticky_comment:
    description: "Update a single tracking comment instead of new comments each turn"
    required: false
    default: "true"
  mode:
    description: >
      Tool surface preset:
        review (default) — repo-scoped read/search tools plus the elek MCP
          server (inline comments + tracking comment). No bash, no write, no
          edit. Cannot approve, merge, or close.
        review+edit — currently the same read-only review surface until
          sandboxed mutation tools are available. Cannot approve/merge/close.
        agent — legacy: full tool surface (read,write,edit,bash,grep,find,ls)
          and no MCP injection. Use only for trusted workflows where the
          model needs shell access.
    required: false
    default: "review"
  review_strategy:
    description: >
      Review orchestration strategy:
        solo (resolved when unset) — one model reviews and posts.
        crosscheck — two independent read-only review lenses, then a final
          orchestrator/validator posts only high-confidence findings.
        council — four independent read-only lenses for larger/high-risk PRs,
          then final orchestrator validation/synthesis.
        thermos — N independent Thermos-style audit agents for high-risk PRs,
          then final orchestrator validation/synthesis.
    required: false
    default: ""
  review_models:
    description: >
      Optional comma-separated model specs for multi-agent reviewer
      lenses. Examples: together/moonshotai/Kimi-K2.7-Code,together/deepseek-ai/DeepSeek-V4-Pro.
      If omitted, the primary provider/model is reused for every lens.
    required: false
    default: ""
  review_lenses:
    description: >
      Optional comma-separated built-in lens IDs for multi-agent reviews.
      This lets repositories select a smaller, domain-specific council, for
      example: security-correctness,contract-drift,mobile-runtime.
    required: false
    default: ""
  review_agent_count:
    description: >
      Optional number of parallel reviewer agents for review_strategy=thermos.
      Valid range: 1-8. If omitted, thermos uses the larger of five default
      audit lenses or the number of review_models supplied.
    required: false
    default: ""
  advisor_model:
    description: >
      Optional model spec for the independent advisor audit that runs in
      parallel with reviewer lenses. If omitted, the validator model is reused.
      Set to off, none, false, or disabled to skip the advisor wave.
    required: false
    default: ""
  advisor_thinking:
    description: >
      Optional thinking level for the independent advisor audit. If omitted,
      validator_thinking is reused, then the primary thinking level.
    required: false
    default: ""
  validator_model:
    description: >
      Optional model spec for the final orchestrator that validates reviewer
      reports and posts findings. Example:
      deepseek/deepseek-v4-pro. If omitted, the primary provider/model is used.
    required: false
    default: ""
  validator_thinking:
    description: >
      Optional thinking level for the final orchestrator. Leave empty to
      reuse thinking. Useful when cheap reviewer agents run high/max reasoning
      but a frontier orchestrator should use medium reasoning.
    required: false
    default: ""
  severity_threshold:
    description: "Prompt-level minimum finding severity to surface: critical, important, or minor. Empty uses .elek.yml or no threshold."
    required: false
    default: ""
  show_cost:
    description: "Show estimated token usage and review cost in the final comment and console log. The cost_usd, input_tokens, and output_tokens action outputs are always populated."
    required: false
    default: "true"
  cost_rates:
    description: >
      Optional pricing overrides as model=inputPerMillion:outputPerMillion,
      e.g. openai/gpt-5.5=5:30,custom/provider-model=1.25:10.
      Prices are USD per 1M tokens.
    required: false
    default: ""
  max_cost_usd:
    description: >
      Optional soft cap for estimated review cost in USD. If a multi-lens
      strategy already exceeds this cap before output tokens, elek downgrades
      to a cheaper strategy. Use 0, off, none, false, or disabled to explicitly
      disable an inherited repo cap.
    required: false
    default: ""
  max_council_changed_lines:
    description: >
      Changed-line warning threshold for council/thermos. Large PRs keep
      their requested strategy; elek slices diff context by file instead.
      Empty uses elek's default warning threshold; 0 disables the warning.
    required: false
    default: ""
  max_crosscheck_changed_lines:
    description: >
      Changed-line warning threshold for crosscheck. Large PRs keep their
      requested strategy; elek slices diff context by file instead.
      Empty uses elek's default warning threshold; 0 disables the warning.
    required: false
    default: ""

outputs:
  conclusion:
    description: "Execution conclusion: success or failure"
    value: ${{ steps.run.outputs.conclusion }}
  branch_name:
    description: "Branch created/used by pi"
    value: ${{ steps.run.outputs.branch_name }}
  comment_id:
    description: "ID of the tracking comment"
    value: ${{ steps.run.outputs.comment_id }}
  session_id:
    description: "pi session ID for continuation"
    value: ${{ steps.run.outputs.session_id }}
  summary:
    description: "Execution summary text"
    value: ${{ steps.run.outputs.summary }}
  cost_usd:
    description: "Estimated review cost in USD"
    value: ${{ steps.run.outputs.cost_usd }}
  input_tokens:
    description: "Estimated input tokens used by the review"
    value: ${{ steps.run.outputs.input_tokens }}
  output_tokens:
    description: "Estimated output tokens used by the review"
    value: ${{ steps.run.outputs.output_tokens }}
  review_summary_path:
    description: "Path to the machine-readable elek review summary JSON file"
    value: ${{ steps.run.outputs.review_summary_path }}
  review_summary_json:
    description: "Machine-readable elek review summary JSON"
    value: ${{ steps.run.outputs.review_summary_json }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24.x"

    - name: Install dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --omit=dev
        # Make node_modules/.bin available on PATH (pi, tsx) so the local,
        # lockfile-pinned pi-mcp-adapter extension can find tsx when pi loads it
        # via `-e $GITHUB_ACTION_PATH/node_modules/pi-mcp-adapter`.
        echo "$GITHUB_ACTION_PATH/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run pi Action
      id: run
      shell: bash
      run: |
        tsx "$GITHUB_ACTION_PATH/src/entrypoints/run.ts"
      env:
        # ── Trigger ──
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}

        # ── Model ──
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THINKING: ${{ inputs.thinking }}

        # ── API Keys ──
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek_api_key }}
        GROQ_API_KEY: ${{ inputs.groq_api_key }}
        MISTRAL_API_KEY: ${{ inputs.mistral_api_key }}
        TOGETHER_API_KEY: ${{ inputs.together_api_key }}
        XAI_API_KEY: ${{ inputs.xai_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}

        # ── GitHub / Behavior ──
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_RUN_TIMEOUT_SECONDS: ${{ inputs.run_timeout_seconds }}
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        INPUT_BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        INPUT_ACTOR_FILTER: ${{ inputs.actor_filter }}
        INPUT_ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        INPUT_STICKY_COMMENT: ${{ inputs.sticky_comment }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        INPUT_REVIEW_MODELS: ${{ inputs.review_models }}
        INPUT_REVIEW_LENSES: ${{ inputs.review_lenses }}
        INPUT_REVIEW_AGENT_COUNT: ${{ inputs.review_agent_count }}
        INPUT_ADVISOR_MODEL: ${{ inputs.advisor_model }}
        INPUT_ADVISOR_THINKING: ${{ inputs.advisor_thinking }}
        INPUT_VALIDATOR_MODEL: ${{ inputs.validator_model }}
        INPUT_VALIDATOR_THINKING: ${{ inputs.validator_thinking }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}
        INPUT_SHOW_COST: ${{ inputs.show_cost }}
        INPUT_COST_RATES: ${{ inputs.cost_rates }}
        INPUT_MAX_COST_USD: ${{ inputs.max_cost_usd }}
        INPUT_MAX_COUNCIL_CHANGED_LINES: ${{ inputs.max_council_changed_lines }}
        INPUT_MAX_CROSSCHECK_CHANGED_LINES: ${{ inputs.max_crosscheck_changed_lines }}

        # ── Runtime ──
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        RUNNER_TEMP: ${{ runner.temp }}
