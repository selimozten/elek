name: "elek — AI Code Review"
description: >
  Read-only AI code review for pull requests. One Pi session with read-only
  tools reviews each PR and posts findings; it cannot approve, merge, or push.
  Bring your own key for any Pi provider.
branding:
  icon: "filter"
  color: "gray-dark"

inputs:
  # ── Model ──
  provider:
    description: "AI provider (anthropic, openai, google, bedrock, deepseek, groq, mistral, together, xai, openrouter, opencode-go, etc.)"
    required: false
    default: "anthropic"
  model:
    description: "Model identifier (e.g. claude-sonnet-4-6, claude-opus-4-8, gpt-5.5, moonshotai/kimi-k2.7-code). Leave empty for provider default."
    required: false
    default: ""
  thinking:
    description: "Portable pi thinking level: off, minimal, low, medium, high, xhigh, max. Provider adapters map to native efforts."
    required: false
    default: "medium"

  # ── API Keys (pass through to pi via standard env vars) ──
  anthropic_api_key:
    description: "Anthropic API key"
    required: false
  openai_api_key:
    description: "OpenAI API key"
    required: false
  google_api_key:
    description: "Google Gemini API key"
    required: false
  deepseek_api_key:
    description: "DeepSeek API key"
    required: false
  groq_api_key:
    description: "Groq API key"
    required: false
  mistral_api_key:
    description: "Mistral API key"
    required: false
  together_api_key:
    description: "Together AI API key"
    required: false
  xai_api_key:
    description: "xAI API key"
    required: false
  openrouter_api_key:
    description: "OpenRouter API key"
    required: false
  opencode_api_key:
    description: "OpenCode API key (OpenCode Zen and Go, e.g. provider opencode-go)"
    required: false

  # ── GitHub Auth ──
  github_token:
    description: "GitHub token with repo and PR permissions. Defaults to GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}

  # ── Behavior ──
  prompt:
    description: "Replaces the built-in review request. Empty uses the default review request."
    required: false
    default: ""
  run_timeout_seconds:
    description: "Stop the model run after this many seconds and report a failure. 0 means no timeout."
    required: false
    default: "0"
  config_path:
    description: "Repo-local elek config file path. Set to 'none', 'off', or 'false' to disable. Default: .elek.yml"
    required: false
    default: ".elek.yml"
  sticky_comment:
    description: "Post live progress and the review in one tracking comment. Set to false to post a PR review only."
    required: false
    default: "true"
  severity_threshold:
    description: "Prompt-level minimum finding severity to surface: critical, important, or minor. Empty uses .elek.yml or no threshold."
    required: false
    default: ""

outputs:
  conclusion:
    description: "success, failure, or skipped"
    value: ${{ steps.run.outputs.conclusion }}
  comment_id:
    description: "ID of the tracking comment"
    value: ${{ steps.run.outputs.comment_id }}
  summary:
    description: "First 1,000 characters of the posted review"
    value: ${{ steps.run.outputs.summary }}
  input_tokens:
    description: "Input tokens used by the review"
    value: ${{ steps.run.outputs.input_tokens }}
  output_tokens:
    description: "Output tokens used by the review"
    value: ${{ steps.run.outputs.output_tokens }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24.x"

    - name: Install dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci --omit=dev
        # Make the local pi and tsx binaries available to later steps.
        echo "$GITHUB_ACTION_PATH/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Run pi Action
      id: run
      shell: bash
      run: |
        tsx "$GITHUB_ACTION_PATH/src/entrypoints/run.ts"
      env:
              # ── Model ──
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THINKING: ${{ inputs.thinking }}

        # ── API Keys ──
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GEMINI_API_KEY: ${{ inputs.google_api_key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek_api_key }}
        GROQ_API_KEY: ${{ inputs.groq_api_key }}
        MISTRAL_API_KEY: ${{ inputs.mistral_api_key }}
        TOGETHER_API_KEY: ${{ inputs.together_api_key }}
        XAI_API_KEY: ${{ inputs.xai_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
        OPENCODE_API_KEY: ${{ inputs.opencode_api_key }}

        # ── GitHub / Behavior ──
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_RUN_TIMEOUT_SECONDS: ${{ inputs.run_timeout_seconds }}
        INPUT_CONFIG_PATH: ${{ inputs.config_path }}
        INPUT_STICKY_COMMENT: ${{ inputs.sticky_comment }}
        INPUT_SEVERITY_THRESHOLD: ${{ inputs.severity_threshold }}

        # ── Runtime ──
        PI_CODING_AGENT_DIR: ${{ github.action_path }}/pi-config
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        RUNNER_TEMP: ${{ runner.temp }}
