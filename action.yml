name: "elek — AI Code Review"
description: >
  Review-only AI for pull requests. Cross-check changes with independent
  models while keeping every reviewer inside a narrow, non-destructive tool
  surface. Anthropic, OpenAI, Google, Bedrock, DeepSeek, Groq, Mistral, xAI,
  OpenRouter — bring your own key.
branding:
  icon: "filter"
  color: "gray-dark"

inputs:
  # ── Trigger ──
  trigger_phrase:
    description: "Phrase in comments or issue body that triggers the action"
    required: false
    default: "@pi"

  # ── Model ──
  provider:
    description: "AI provider (anthropic, openai, google, bedrock, deepseek, groq, mistral, xai, openrouter, etc.)"
    required: false
    default: "anthropic"
  model:
    description: "Model identifier (e.g. claude-sonnet-4-6, claude-opus-4-8, gpt-5.5, moonshotai/kimi-k2.7-code). Leave empty for provider default."
    required: false
    default: ""
  thinking:
    description: "Portable pi thinking level: off, minimal, low, medium, high, xhigh. Provider adapters map to native efforts, e.g. Claude max."
    required: false
    default: "medium"

  # ── API Keys (pass through to pi via standard env vars) ──
  anthropic_api_key:
    description: "Anthropic API key"
    required: false
  openai_api_key:
    description: "OpenAI API key"
    required: false
  google_api_key:
    description: "Google Gemini API key"
    required: false
  deepseek_api_key:
    description: "DeepSeek API key"
    required: false
  groq_api_key:
    description: "Groq API key"
    required: false
  mistral_api_key:
    description: "Mistral API key"
    required: false
  xai_api_key:
    description: "xAI API key"
    required: false
  openrouter_api_key:
    description: "OpenRouter API key"
    required: false

  # ── GitHub Auth ──
  github_token:
    description: "GitHub token with repo and PR permissions. Defaults to GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}

  # ── Behavior ──
  prompt:
    description: "Custom instructions for pi. If empty and triggered via @pi mention, uses the comment/issue body."
    required: false
    default: ""
  system_prompt:
    description: "System prompt override for pi"
    required: false
    default: ""
  max_turns:
    description: "Maximum conversation turns (limits cost). Default: 20."
    required: false
    default: "20"
  tools:
    description: "Legacy low-level pi tool allowlist. Review modes use mode presets; prefer mode unless debugging agent mode."
    required: false
    default: ""
  base_branch:
    description: "Base branch for PRs (defaults to repository default branch)"
    required: false
  branch_prefix:
    description: "Prefix for branches created by elek"
    required: false
    default: "elek/"
  actor_filter:
    description: "Comma-separated usernames allowed to trigger. Empty = all humans."
    required: false
    default: ""
  allowed_bots:
    description: "Comma-separated bot usernames allowed to trigger, or '*' for all"
    required: false
    default: ""
  sticky_comment:
    description: "Update a single tracking comment instead of new comments each turn"
    required: false
    default: "true"
  mode:
    description: >
      Tool surface preset:
        review (default) — model can only read code and post review feedback
          via the elek MCP server (inline comments + tracking comment). No
          bash, no write, no edit. Cannot approve, merge, or close.
        review+edit — also allows write/edit so the model can push fixes to
          its own elek/* branch. Still no bash. Cannot approve/merge/close.
        agent — legacy: full tool surface (read,write,edit,bash,grep,find,ls)
          and no MCP injection. Use only for trusted workflows where the
          model needs shell access.
    required: false
    default: "review"
  review_strategy:
    description: >
      Review orchestration strategy:
        solo (default) — one model reviews and posts.
        crosscheck — two independent read-only review lenses, then a final
          validator/synthesizer posts only high-confidence findings.
        council — four independent read-only lenses for larger/high-risk PRs,
          then final validation/synthesis.
    required: false
    default: "solo"
  review_models:
    description: >
      Optional comma-separated model specs for crosscheck/council reviewer
      lenses. Examples: deepseek/deepseek-v4-pro,openrouter/moonshotai/kimi-k2.7-code.
      If omitted, the primary provider/model is reused for every lens.
    required: false
    default: ""
  validator_model:
    description: >
      Optional model spec for final validation/synthesis. Example:
      deepseek/deepseek-v4-pro. If omitted, the primary provider/model is used.
    required: false
    default: ""
  show_cost:
    description: "Show estimated token usage and review cost in the final comment and outputs."
    required: false
    default: "true"
  cost_rates:
    description: >
      Optional pricing overrides as model=inputPerMillion:outputPerMillion,
      e.g. openai/gpt-5.5=1.25:10,anthropic/claude-sonnet-4-6=3:15.
      Prices are USD per 1M tokens.
    required: false
    default: ""

outputs:
  conclusion:
    description: "Execution conclusion: success or failure"
    value: ${{ steps.run.outputs.conclusion }}
  branch_name:
    description: "Branch created/used by pi"
    value: ${{ steps.run.outputs.branch_name }}
  comment_id:
    description: "ID of the tracking comment"
    value: ${{ steps.run.outputs.comment_id }}
  session_id:
    description: "pi session ID for continuation"
    value: ${{ steps.run.outputs.session_id }}
  summary:
    description: "Execution summary text"
    value: ${{ steps.run.outputs.summary }}
  cost_usd:
    description: "Estimated review cost in USD"
    value: ${{ steps.run.outputs.cost_usd }}
  input_tokens:
    description: "Estimated input tokens used by the review"
    value: ${{ steps.run.outputs.input_tokens }}
  output_tokens:
    description: "Estimated output tokens used by the review"
    value: ${{ steps.run.outputs.output_tokens }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "24.x"

    - name: Install dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm install --omit=dev --no-package-lock
        # Make node_modules/.bin available on PATH (pi, tsx) so pi-mcp-adapter
        # can find tsx when it spawns the MCP server child process.
        echo "$GITHUB_ACTION_PATH/node_modules/.bin" >> "$GITHUB_PATH"
        # Register pi-mcp-adapter so the model gets the `mcp` proxy tool.
        # Skip via ELEK_DISABLE_MCP=1 if you need a clean fallback.
        if [ "${ELEK_DISABLE_MCP:-}" != "1" ]; then
          ./node_modules/.bin/pi install npm:pi-mcp-adapter || true
        fi

    - name: Run pi Action
      id: run
      shell: bash
      run: |
        tsx "$GITHUB_ACTION_PATH/src/entrypoints/run.ts"
      env:
        # ── Trigger ──
        INPUT_TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}

        # ── Model ──
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_THINKING: ${{ inputs.thinking }}

        # ── API Keys ──
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GOOGLE_API_KEY: ${{ inputs.google_api_key }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek_api_key }}
        GROQ_API_KEY: ${{ inputs.groq_api_key }}
        MISTRAL_API_KEY: ${{ inputs.mistral_api_key }}
        XAI_API_KEY: ${{ inputs.xai_api_key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}

        # ── GitHub / Behavior ──
        GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_TOOLS: ${{ inputs.tools }}
        INPUT_BASE_BRANCH: ${{ inputs.base_branch }}
        INPUT_BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        INPUT_ACTOR_FILTER: ${{ inputs.actor_filter }}
        INPUT_ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        INPUT_STICKY_COMMENT: ${{ inputs.sticky_comment }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REVIEW_STRATEGY: ${{ inputs.review_strategy }}
        INPUT_REVIEW_MODELS: ${{ inputs.review_models }}
        INPUT_VALIDATOR_MODEL: ${{ inputs.validator_model }}
        INPUT_SHOW_COST: ${{ inputs.show_cost }}
        INPUT_COST_RATES: ${{ inputs.cost_rates }}

        # ── Runtime ──
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_ACTION: ${{ github.event.action }}
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_EVENT_PATH: ${{ github.event_path }}
        RUNNER_TEMP: ${{ runner.temp }}
