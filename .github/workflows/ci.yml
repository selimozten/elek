name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Skip the tests workflow on docs-only churn. The AI self-review workflow
    # is advisory; this remains the hard correctness gate for code changes.
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Cancel a running CI job when a newer commit lands on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests + types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # No lockfile in repo (composite action installs fresh in production);
        # let bun resolve from package.json each run.
        run: bun install --no-save

      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev --no-package-lock

      - name: Run tests
        run: bun test test/

      - name: Type check
        run: bunx tsc --noEmit
