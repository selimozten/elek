name: elek

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Don't review docs-only churn — wastes API budget on text reviews.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  issue_comment:
    types: [created]
  issues:
    types: [opened]

# When the same branch gets multiple pushes in quick succession, cancel
# the in-flight review and only run on the latest commit. Saves API spend.
concurrency:
  group: elek-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

# Self-review is advisory because provider quota and transient model failures
# should not block test-verified code. The action itself still posts a visible
# tracking comment when a provider fails.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ── DeepSeek v4 Pro ───────────────────────────────────────────────────
  deepseek:
    name: "deepseek-v4-pro"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Advisory elek review
        id: review
        uses: ./
        continue-on-error: true
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          provider: deepseek
          model: deepseek-v4-pro
          thinking: high
          branch_prefix: elek/deepseek/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.

      - name: Report advisory review failure
        if: steps.review.outcome == 'failure'
        run: echo "::warning::Advisory DeepSeek review failed; inspect the tracking comment and run logs."

  # ── Z.AI GLM-5.1 ──────────────────────────────────────────────────────
  zai:
    name: "glm-5.1 (Z.AI)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Advisory elek review
        id: review
        uses: ./
        continue-on-error: true
        with:
          zai_api_key: ${{ secrets.ZAI_API_KEY }}
          provider: zai
          model: glm-5.1
          thinking: high
          branch_prefix: elek/zai/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.

      - name: Report advisory review failure
        if: steps.review.outcome == 'failure'
        run: echo "::warning::Advisory Z.AI review failed; inspect the tracking comment and run logs."
