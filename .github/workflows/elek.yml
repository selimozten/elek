name: elek

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR cancels the in-flight review.
concurrency:
  group: elek-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Dogfoods the Action from this checkout. Advisory: provider quota and
  # transient model failures should not block test-verified code.
  review:
    name: "deepseek-v4.1-flash"
    # Fork PRs get no secrets and a read-only token.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Advisory elek review
        id: review
        uses: ./
        continue-on-error: true
        with:
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          provider: opencode-go
          model: deepseek-v4.1-flash
          thinking: high

      - name: Report advisory review failure
        if: steps.review.outcome == 'failure'
        run: echo "::warning::Advisory elek review failed; inspect the tracking comment and run logs."
