name: elek

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Don't review docs-only churn — wastes API budget on text reviews.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  issue_comment:
    types: [created]
  issues:
    types: [opened]

# When the same branch gets multiple pushes in quick succession, cancel
# the in-flight review and only run on the latest commit. Saves API spend.
concurrency:
  group: elek-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

# review mode tools are read-only — bot can't approve/merge/close even if
# jailbroken. `contents: write` is needed only for the (currently rare)
# review+edit / agent modes that push to a pi/* branch. Drop to `read` if
# you only run review mode.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ── DeepSeek v4 Pro ───────────────────────────────────────────────────
  deepseek:
    name: "deepseek-v4-pro"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          provider: deepseek
          model: deepseek-v4-pro
          thinking: high
          branch_prefix: pi/deepseek/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.

  # ── Z.AI GLM-5.1 ──────────────────────────────────────────────────────
  zai:
    name: "glm-5.1 (Z.AI)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          zai_api_key: ${{ secrets.ZAI_API_KEY }}
          provider: zai
          model: glm-5.1
          thinking: high
          branch_prefix: pi/zai/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.
