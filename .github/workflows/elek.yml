name: elek

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # ── DeepSeek v4 Pro ───────────────────────────────────────────────────
  deepseek:
    name: "deepseek-v4-pro"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          provider: deepseek
          model: deepseek-v4-pro
          thinking: high
          branch_prefix: pi/deepseek/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.

  # ── Z.AI GLM-5.1 ──────────────────────────────────────────────────────
  zai:
    name: "glm-5.1 (Z.AI)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./
        with:
          zai_api_key: ${{ secrets.ZAI_API_KEY }}
          provider: zai
          model: glm-5.1
          thinking: high
          branch_prefix: pi/zai/
          prompt: |
            Review this PR for correctness, security, performance, and style.
            Be specific — reference files and line numbers. Think step by step.
